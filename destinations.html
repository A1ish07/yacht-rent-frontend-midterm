<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacht Rental — Destinations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">YachtRent</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="yachts.html">Yachts</a></li>
                        <li class="nav-item"><a class="nav-link active" href="destinations.html">Destinations</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                    <button type="button" id="theme-toggle" class="btn btn-sm text-white theme-btn ms-lg-3 mt-2 mt-lg-0">🌙</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <h1 class="text-center mb-3">Choose a route and we will plan the rest.</h1>

        <div class="d-flex justify-content-center flex-wrap gap-2 mb-4" id="region-filters">
            <button type="button" class="btn btn-outline-dark active" data-region="all">All</button>
            <button type="button" class="btn btn-outline-dark" data-region="Mediterranean">Mediterranean</button>
            <button type="button" class="btn btn-outline-dark" data-region="Caribbean">Caribbean</button>
            <button type="button" class="btn btn-outline-dark" data-region="Indian Ocean">Indian Ocean</button>
        </div>

        <section class="destinations-grid" id="routes"></section>
        <section class="mt-5" id="weather-section" aria-labelledby="weather-title">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="h4 mb-0" id="weather-title">Weather in popular destinations</h2>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="weather-refresh">Refresh</button>
            </div>
            <div id="weather-status" role="status" aria-live="polite"></div>
            <div class="row g-3" id="weather-list"></div>
        </section>
        <section class="text-center mt-5">
            <a href="contact.html" class="btn btn-gold px-5">Plan My Trip</a>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">2026 YachtRent.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Yacht.js"></script>
    <script src="js/data.js"></script>
    <script src="js/destinations.js"></script>
    <script src="js/weather.js"></script>
</body>
</html>
