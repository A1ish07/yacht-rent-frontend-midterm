<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacht Rental — Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">YachtRent</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="yachts.html">Yachts</a></li>
                        <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <h1 class="text-center mb-5">Book Your Yacht</h1>

        <div class="row g-5">
            <section class="col-12 col-lg-7">
                <h2 class="h4 mb-3">Booking Request</h2>
                <form action="#" method="post" id="booking-form">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="yacht" class="form-label">Yacht</label>
                            <select class="form-select" id="yacht" name="yacht" required>
                                <option value="">5 yacht available now</option>
                                <option>Azure Spirit</option>
                                <option>Ocean Pearl</option>
                                <option>Golden Horizon</option>
                                <option>Sea Breeze</option>
                                <option>Royal Wave</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date" class="form-label">Start date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gold px-5">Send Request</button>
                </form>
            </section>

            <section class="col-12 col-lg-5">
                <h2 class="h4 mb-3">Contact Details</h2>
                <ul class="contact-info list-unstyled">
                    <li><strong>Phone:</strong> +7 676 67 67</li>
                    <li><strong>Email:</strong> sanyabussiness@gmail.com</li>
                    <li><strong>Address:</strong> Turan 67</li>
                    <li><strong>Hours:</strong> Mon–Sun, 08:00–18:00</li>
                </ul>
                <p>Check yacht Availability on the <a href="yachts.html">Yachts</a> page.</p>
            </section>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">2026 YachtRent.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
